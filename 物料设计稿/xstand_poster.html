
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @page { size: 800px 1800px; margin: 0; }
  @font-face { font-family: 'Gloock'; src: url('/Users/panshuai/Library/Application Support/QClaw/openclaw/config/skills/canvas-design/canvas-fonts/Gloock-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'InstrumentBold'; src: url('/Users/panshuai/Library/Application Support/QClaw/openclaw/config/skills/canvas-design/canvas-fonts/InstrumentSans-Bold.ttf') format('truetype'); }
  @font-face { font-family: 'CrimsonBold'; src: url('/Users/panshuai/Library/Application Support/QClaw/openclaw/config/skills/canvas-design/canvas-fonts/CrimsonPro-Bold.ttf') format('truetype'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    width: 800px; height: 1800px;
    background: linear-gradient(180deg, #FFE8F0 0%, #FFF5F8 15%, #FFFFFF 40%, #FFF0F5 70%, #FFE8F0 100%);
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    position: relative; overflow: hidden;
  }
  
  /* Top decorative arch */
  .arch {
    position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
    width: 500px; height: 200px;
    background: radial-gradient(ellipse at center, rgba(255,182,193,0.3) 0%, transparent 70%);
    border-radius: 50%;
  }
  
  /* Gold frame */
  .frame {
    position: absolute; top: 30px; left: 30px; right: 30px; bottom: 30px;
    border: 2px solid rgba(218,165,32,0.4); border-radius: 20px;
  }
  .frame-inner {
    position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px;
    border: 1px solid rgba(218,165,32,0.2); border-radius: 14px;
  }
  
  .content {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center;
    height: 100%; padding: 80px 50px 50px 50px;
  }
  
  .brand {
    font-size: 60px; font-weight: 900; color: #E84D8A;
    letter-spacing: 20px; text-align: center; margin-bottom: 20px;
  }
  
  .divider {
    width: 200px; height: 3px;
    background: linear-gradient(90deg, transparent, #FFD700, transparent);
    margin-bottom: 30px;
  }
  
  .hero-number {
    font-size: 180px; font-weight: 900; color: #DAA520;
    font-family: 'CrimsonBold', serif;
    line-height: 1; margin-bottom: 10px;
    background: linear-gradient(180deg, #FFD700, #DAA520);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero-unit {
    font-size: 50px; color: #333; font-weight: 300;
    margin-bottom: 15px;
  }
  
  .subtitle {
    font-size: 36px; color: #666; letter-spacing: 10px;
    margin-bottom: 40px;
  }
  
  .price-block {
    background: white; border: 2px solid #FFD700;
    border-radius: 30px; padding: 30px 60px;
    text-align: center; margin-bottom: 35px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .price-label {
    font-size: 22px; color: #999; letter-spacing: 5px; margin-bottom: 5px;
  }
  .price-num {
    font-size: 120px; font-weight: 900; color: #E84D8A;
    font-family: 'InstrumentBold', sans-serif;
    line-height: 1;
  }
  .price-num .yuan {
    font-size: 40px; font-weight: 400;
  }
  .price-sub {
    font-size: 24px; color: #999; margin-top: 5px;
  }
  
  .features-row {
    display: flex; gap: 40px; margin-bottom: 30px;
  }
  .feat {
    text-align: center; font-size: 20px; color: #666;
  }
  .feat .icon {
    font-size: 48px; display: block; margin-bottom: 10px;
  }
  
  .bottom {
    text-align: center; font-size: 28px; color: #333; font-weight: 700;
    margin-bottom: 10px;
  }
  .bottom-sub {
    font-size: 20px; color: #888;
  }
  
  .qr-zone {
    position: absolute; bottom: 60px; right: 60px;
    width: 120px; height: 120px;
    border: 2px dashed #FFB6C1; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #FFB6C1; text-align: center;
  }
</style>
</head>
<body>
  <div class="arch"></div>
  <div class="frame"></div>
  <div class="frame-inner"></div>
  
  <div class="content">
    <div class="brand">帅帅亲子乐园</div>
    <div class="divider"></div>
    <div class="hero-number">1100</div>
    <div class="hero-unit">平方米</div>
    <div class="subtitle">全城最大室内儿童主题乐园</div>
    
    <div class="price-block">
      <div class="price-label">▸ 预售早鸟特惠 ◂</div>
      <div class="price-num">498<span class="yuan">元</span></div>
      <div class="price-sub">单人年卡 · 全年不限次 · 原价698元</div>
    </div>
    
    <div class="features-row">
      <div class="feat"><span class="icon">🏰</span>大型淘气堡</div>
      <div class="feat"><span class="icon">🫧</span>海洋球池</div>
      <div class="feat"><span class="icon">🤸</span>软体蹦床</div>
      <div class="feat"><span class="icon">🎨</span>亲子手工</div>
    </div>
    
    <div class="bottom">📅 7月5日 盛大开业</div>
    <div class="bottom-sub">📍 市中心 · 扫码加微信抢预售名额</div>
  </div>
  
  <div class="qr-zone">扫码加微信<br>领9.9元体验券</div>
</body>
</html>
